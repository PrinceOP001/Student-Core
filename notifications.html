<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Core - Notifications</title>
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/pages.css">
</head>
<body>

    <h1>Notifications & Reminders</h1>
    <p><a href="dashboard.html">← Dashboard</a></p>

    <hr>

    <h2>Add Reminder</h2>

    <form id="reminderForm">
        <input id="reminderTitle" type="text" placeholder="Reminder title" required>
        <input id="reminderDate" type="date" required>
        <input id="reminderTime" type="time" required>

        <select id="reminderRepeat">
            <option value="Once">Once</option>
            <option value="Daily">Daily</option>
            <option value="Weekly">Weekly</option>
        </select>

        <input id="reminderNote" type="text" placeholder="Note (optional)">

        <button type="submit">Add Reminder</button>
    </form>

    <p>
        Browser notifications work only after permission is granted.
        Email notifications will require a backend/email service later.
    </p>

    <hr>

    <h2>Reminders</h2>
    <div id="reminderList"></div>

    <script>
        const REMINDER_KEY = "studentCore_reminders";

        let reminders = JSON.parse(localStorage.getItem(REMINDER_KEY)) || [];

        function saveReminders() {
            localStorage.setItem(REMINDER_KEY, JSON.stringify(reminders));
        }

        async function requestNotificationPermission() {
            if (!("Notification" in window)) {
                alert("This browser does not support notifications.");
                return;
            }

            if (Notification.permission === "default") {
                await Notification.requestPermission();
            }

            if (Notification.permission === "denied") {
                alert("Notifications are blocked. Please allow them in browser settings.");
            }
        }

        function addReminder(event) {
            event.preventDefault();

            const reminder = {
                id: Date.now(),
                title: document.getElementById("reminderTitle").value.trim(),
                date: document.getElementById("reminderDate").value,
                time: document.getElementById("reminderTime").value,
                repeat: document.getElementById("reminderRepeat").value,
                note: document.getElementById("reminderNote").value.trim(),
                enabled: true,
                lastSent: null
            };

            reminders.push(reminder);
            saveReminders();

            event.target.reset();
            renderReminders();
            requestNotificationPermission();
        }

        function editReminder(id) {
            const reminder = reminders.find(item => item.id === id);
            if (!reminder) return;

            const title = prompt("Reminder title:", reminder.title);
            if (title === null) return;

            const date = prompt("Date (YYYY-MM-DD):", reminder.date);
            if (date === null) return;

            const time = prompt("Time (HH:MM):", reminder.time);
            if (time === null) return;

            const repeat = prompt(
                "Repeat (Once / Daily / Weekly):",
                reminder.repeat
            );
            if (repeat === null) return;

            const note = prompt("Note:", reminder.note);
            if (note === null) return;

            if (!["Once", "Daily", "Weekly"].includes(repeat)) {
                alert("Invalid repeat option.");
                return;
            }

            reminder.title = title.trim() || reminder.title;
            reminder.date = date;
            reminder.time = time;
            reminder.repeat = repeat;
            reminder.note = note.trim();

            // Allow the edited reminder to trigger again.
            reminder.lastSent = null;

            saveReminders();
            renderReminders();
        }

        function removeReminder(id) {
            if (!confirm("Remove this reminder?")) return;

            reminders = reminders.filter(reminder => reminder.id !== id);
            saveReminders();
            renderReminders();
        }

        function toggleReminder(id) {
            const reminder = reminders.find(item => item.id === id);
            if (!reminder) return;

            reminder.enabled = !reminder.enabled;
            saveReminders();
            renderReminders();
        }

        function renderReminders() {
            const list = document.getElementById("reminderList");

            const sorted = [...reminders].sort((a, b) => {
                return `${a.date} ${a.time}`.localeCompare(`${b.date} ${b.time}`);
            });

            if (sorted.length === 0) {
                list.innerHTML = "<p>No reminders added yet.</p>";
                return;
            }

            list.innerHTML = sorted.map(reminder => `
                <article>
                    <hr>
                    <h3>${escapeHTML(reminder.title)}</h3>

                    <p>
                        Date: ${reminder.date}
                        <br>
                        Time: ${reminder.time}
                        <br>
                        Repeat: ${reminder.repeat}
                        <br>
                        Status: ${reminder.enabled ? "Enabled" : "Disabled"}
                        ${reminder.note ? `<br>Note: ${escapeHTML(reminder.note)}` : ""}
                    </p>

                    <button onclick="toggleReminder(${reminder.id})">
                        ${reminder.enabled ? "Disable" : "Enable"}
                    </button>
                    <button onclick="editReminder(${reminder.id})">Edit</button>
                    <button onclick="removeReminder(${reminder.id})">Remove</button>
                </article>
            `).join("");
        }

        function reminderIsDue(reminder, now) {
            if (!reminder.enabled) return false;

            const target = new Date(`${reminder.date}T${reminder.time}:00`);

            if (reminder.repeat === "Once") {
                return now >= target;
            }

            if (reminder.repeat === "Daily") {
                return now.getHours() === target.getHours() &&
                       now.getMinutes() === target.getMinutes();
            }

            if (reminder.repeat === "Weekly") {
                return now.getDay() === target.getDay() &&
                       now.getHours() === target.getHours() &&
                       now.getMinutes() === target.getMinutes();
            }

            return false;
        }

        function getOccurrenceKey(reminder, now) {
            if (reminder.repeat === "Once") {
                return reminder.date + " " + reminder.time;
            }

            if (reminder.repeat === "Daily") {
                return now.toISOString().slice(0, 10);
            }

            return now.getFullYear() + "-" +
                   String(now.getMonth() + 1).padStart(2, "0") + "-" +
                   String(now.getDate()).padStart(2, "0");
        }

        function checkReminders() {
            const now = new Date();

            reminders.forEach(reminder => {
                if (!reminderIsDue(reminder, now)) return;

                const occurrence = getOccurrenceKey(reminder, now);

                if (reminder.lastSent === occurrence) return;

                sendNotification(reminder);

                reminder.lastSent = occurrence;

                if (reminder.repeat === "Once") {
                    reminder.enabled = false;
                }
            });

            saveReminders();
            renderReminders();
        }

        function sendNotification(reminder) {
            if (!("Notification" in window)) return;

            if (Notification.permission === "granted") {
                new Notification(reminder.title, {
                    body: reminder.note || "Student Core reminder"
                });
            }
        }

        function escapeHTML(text) {
            return String(text).replace(/[&<>"']/g, char => ({
                "&": "&amp;",
                "<": "&lt;",
                ">": "&gt;",
                '"': "&quot;",
                "'": "&#039;"
            }[char]));
        }

        document.getElementById("reminderForm")
            .addEventListener("submit", addReminder);

        requestNotificationPermission();
        renderReminders();

        // Check every 30 seconds while the page is open.
        checkReminders();
        setInterval(checkReminders, 30000);
    </script>
</body>
</html>
