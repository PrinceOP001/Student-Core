<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Core - Notes</title>
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/pages.css">
</head>
<body>

    <h1>Notes</h1>
    <p><a href="dashboard.html">← Dashboard</a></p>

    <hr>

    <h2>Add Note</h2>

    <form id="noteForm">
        <input id="noteTitle" type="text" placeholder="Note title" required>
        <input id="noteSubject" type="text" placeholder="Subject">
        <input id="noteFile" type="file" accept=".pdf,.doc,.docx,.txt,image/*" required>
        <button type="submit">Upload Note</button>
    </form>

    <p>
        Notes are stored locally in this browser using IndexedDB.
    </p>

    <h2>Saved Notes</h2>
    <div id="noteList"></div>

    <script>
        const DB_NAME = "StudentCoreNotes";
        const STORE_NAME = "notes";
        let db;

        function openDatabase() {
            return new Promise((resolve, reject) => {
                const request = indexedDB.open(DB_NAME, 1);

                request.onupgradeneeded = function () {
                    const database = request.result;

                    if (!database.objectStoreNames.contains(STORE_NAME)) {
                        database.createObjectStore(STORE_NAME, {
                            keyPath: "id",
                            autoIncrement: true
                        });
                    }
                };

                request.onsuccess = function () {
                    db = request.result;
                    resolve();
                };

                request.onerror = function () {
                    reject(request.error);
                };
            });
        }

        function addNote(note) {
            return new Promise((resolve, reject) => {
                const transaction = db.transaction(STORE_NAME, "readwrite");
                const store = transaction.objectStore(STORE_NAME);

                const request = store.add(note);

                request.onsuccess = () => resolve();
                request.onerror = () => reject(request.error);
            });
        }

        function getNotes() {
            return new Promise((resolve, reject) => {
                const transaction = db.transaction(STORE_NAME, "readonly");
                const store = transaction.objectStore(STORE_NAME);
                const request = store.getAll();

                request.onsuccess = () => resolve(request.result);
                request.onerror = () => reject(request.error);
            });
        }

        function deleteNote(id) {
            return new Promise((resolve, reject) => {
                const transaction = db.transaction(STORE_NAME, "readwrite");
                const request = transaction.objectStore(STORE_NAME).delete(id);

                request.onsuccess = () => resolve();
                request.onerror = () => reject(request.error);
            });
        }

        async function renderNotes() {
            const list = document.getElementById("noteList");
            const notes = await getNotes();

            if (notes.length === 0) {
                list.innerHTML = "<p>No notes uploaded yet.</p>";
                return;
            }

            list.innerHTML = notes.map(note => `
                <article>
                    <hr>
                    <h3>${escapeHTML(note.title)}</h3>
                    <p>
                        Subject: ${escapeHTML(note.subject || "General")}
                        <br>
                        File: ${escapeHTML(note.fileName)}
                    </p>
                    <button onclick="openNote(${note.id})">Open</button>
                    <button onclick="removeNote(${note.id})">Remove</button>
                </article>
            `).join("");
        }

        async function openNote(id) {
            const notes = await getNotes();
            const note = notes.find(note => note.id === id);

            if (!note) return;

            const url = URL.createObjectURL(note.file);
            window.open(url, "_blank");

            // Keep the URL alive for the opened tab.
            setTimeout(() => URL.revokeObjectURL(url), 60000);
        }

        async function removeNote(id) {
            if (!confirm("Remove this note?")) return;

            await deleteNote(id);
            renderNotes();
        }

        document.getElementById("noteForm").addEventListener("submit", async function (event) {
            event.preventDefault();

            const file = document.getElementById("noteFile").files[0];

            if (!file) {
                alert("Please select a file.");
                return;
            }

            await addNote({
                title: document.getElementById("noteTitle").value.trim(),
                subject: document.getElementById("noteSubject").value.trim(),
                fileName: file.name,
                file: file,
                createdAt: new Date().toISOString()
            });

            this.reset();
            renderNotes();
        });

        function escapeHTML(text) {
            return String(text).replace(/[&<>"']/g, char => ({
                "&": "&amp;",
                "<": "&lt;",
                ">": "&gt;",
                '"': "&quot;",
                "'": "&#039;"
            }[char]));
        }

        openDatabase()
            .then(renderNotes)
            .catch(error => {
                console.error(error);
                document.getElementById("noteList").innerHTML =
                    "<p>Could not open local note storage in this browser.</p>";
            });
    </script>
</body>
</html>
