<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Core - Attendance</title>
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/pages.css">
</head>
<body>

    <h1>Attendance</h1>
    <p><a href="dashboard.html">← Dashboard</a></p>

    <hr>

    <h2>Overall Attendance</h2>
    <div id="overall"></div>

    <h2>Attendance Calculator</h2>
    <label>
        Target percentage:
        <input id="target" type="number" value="75" min="1" max="100">
    </label>
    <button onclick="calculateOverall()">Calculate</button>
    <div id="calculator"></div>

    <hr>

    <h2>Subjects</h2>

    <form id="subjectForm">
        <input id="subjectName" type="text" placeholder="Subject name" required>
        <input id="subjectTotal" type="number" min="0" placeholder="Total lectures" required>
        <input id="subjectPresent" type="number" min="0" placeholder="Attended lectures" required>
        <button type="submit">Add Subject</button>
    </form>

    <div id="subjects"></div>

    <script>
        const STORAGE_KEY = "studentCore_attendance";

        let subjects = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];

        function save() {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(subjects));
        }

        function percentage(present, total) {
            return total > 0 ? (present / total) * 100 : 0;
        }

        function getRequiredClasses(present, total, target) {
            if (total === 0) return 0;
            if (percentage(present, total) >= target) return 0;

            // (present + x) / (total + x) >= target
            return Math.ceil((target * total - present) / (1 - target));
        }

        function getCanMiss(present, total, target) {
            if (total === 0 || percentage(present, total) < target) return 0;

            // (present) / (total + x) >= target
            return Math.max(0, Math.floor(present / target - total));
        }

        function render() {
            const list = document.getElementById("subjects");

            if (subjects.length === 0) {
                list.innerHTML = "<p>No subjects added yet.</p>";
            } else {
                list.innerHTML = subjects.map((subject, index) => {
                    const percent = percentage(subject.present, subject.total);
                    const target = Number(document.getElementById("target").value) / 100;
                    const required = getRequiredClasses(subject.present, subject.total, target);
                    const canMiss = getCanMiss(subject.present, subject.total, target);

                    return `
                        <article>
                            <hr>
                            <h3>${escapeHTML(subject.name)}</h3>

                            <p>
                                Present: ${subject.present} /
                                Total: ${subject.total}
                                <br>
                                Attendance: <strong>${percent.toFixed(2)}%</strong>
                            </p>

                            <button onclick="markAttendance(${index}, true)">+ Present</button>
                            <button onclick="markAttendance(${index}, false)">+ Absent</button>
                            <button onclick="removeSubject(${index})">Remove</button>

                            <p>
                                ${percent < target * 100
                                    ? `Need <strong>${required}</strong> consecutive present class(es) to reach ${target * 100}%.`
                                    : `You can miss <strong>${canMiss}</strong> class(es) and stay at or above ${target * 100}%.`
                                }
                            </p>
                        </article>
                    `;
                }).join("");
            }

            updateOverall();
        }

        function markAttendance(index, present) {
            subjects[index].total++;

            if (present) {
                subjects[index].present++;
            }

            save();
            render();
        }

        function removeSubject(index) {
            if (confirm("Remove this subject?")) {
                subjects.splice(index, 1);
                save();
                render();
            }
        }

        function updateOverall() {
            const total = subjects.reduce((sum, s) => sum + s.total, 0);
            const present = subjects.reduce((sum, s) => sum + s.present, 0);
            const percent = percentage(present, total);

            document.getElementById("overall").innerHTML = `
                <p>
                    Attended: <strong>${present}</strong> /
                    Total Lectures: <strong>${total}</strong>
                    <br>
                    Overall: <strong>${percent.toFixed(2)}%</strong>
                </p>
            `;

            calculateOverall(false);
        }

        function calculateOverall(showMessage = true) {
            const targetPercent = Number(document.getElementById("target").value);

            if (targetPercent <= 0 || targetPercent >= 100) {
                document.getElementById("calculator").innerHTML =
                    "<p>Target must be between 1% and 99%.</p>";
                return;
            }

            const target = targetPercent / 100;
            const total = subjects.reduce((sum, s) => sum + s.total, 0);
            const present = subjects.reduce((sum, s) => sum + s.present, 0);

            if (total === 0) {
                document.getElementById("calculator").innerHTML =
                    "<p>Add attendance data first.</p>";
                return;
            }

            const current = present / total;

            if (current < target) {
                const needed = getRequiredClasses(present, total, target);
                document.getElementById("calculator").innerHTML =
                    `<p>You need <strong>${needed}</strong> consecutive present class(es) to reach ${targetPercent}% overall attendance.</p>`;
            } else {
                const canMiss = getCanMiss(present, total, target);
                document.getElementById("calculator").innerHTML =
                    `<p>You can miss <strong>${canMiss}</strong> class(es) and remain at or above ${targetPercent}%.</p>`;
            }
        }

        document.getElementById("subjectForm").addEventListener("submit", function (event) {
            event.preventDefault();

            const name = document.getElementById("subjectName").value.trim();
            const total = Number(document.getElementById("subjectTotal").value);
            const present = Number(document.getElementById("subjectPresent").value);

            if (!name || total < 0 || present < 0 || present > total) {
                alert("Please enter valid attendance values.");
                return;
            }

            subjects.push({ name, total, present });
            save();
            this.reset();
            render();
        });

        function escapeHTML(text) {
            return text.replace(/[&<>"']/g, char => ({
                "&": "&amp;",
                "<": "&lt;",
                ">": "&gt;",
                '"': "&quot;",
                "'": "&#039;"
            }[char]));
        }

        render();
    </script>
</body>
</html>
